<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>رادیو ارک ماین</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

:root {
  --font-fa: "Segoe UI", Tahoma, "Iranian Sans", "Vazirmatn",
             system-ui, -apple-system, "Noto Sans Arabic", "DejaVu Sans",
             Arial, sans-serif;
  --accent: #2dd4bf;
  --accent-light: #a5f3fc;
  --accent-dark: #0f766e;
  --bg-dark: #0b0e14;
  --bg-mid: #1a1f2c;
  --panel: rgba(20, 25, 35, 0.9);
  --danger: #ef4444;
}

html {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  width: 100%;
  height: 100vh;
  height: calc(var(--vh, 1vh) * 100);
  height: 100dvh;
  overflow: hidden;
  font-family: var(--font-fa);
  background: linear-gradient(145deg, var(--bg-dark), var(--bg-mid));
  background-attachment: fixed;
  display: flex;
  justify-content: center;
  align-items: center;
  padding:
    calc(10px + env(safe-area-inset-top, 0px))
    calc(10px + env(safe-area-inset-right, 0px))
    calc(10px + env(safe-area-inset-bottom, 0px))
    calc(10px + env(safe-area-inset-left, 0px));
  color: #fff;
  -webkit-user-select: none;
  user-select: none;
  transform: translateZ(0);
  backface-visibility: hidden;
  overscroll-behavior: none;
  position: fixed;
  inset: 0;
  line-height: 1.4;
}

.radio {
  width: 100%;
  max-width: 400px;
  max-height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  background: var(--panel);
  border-radius: 32px;
  padding: 20px 16px;
  box-shadow:
    0 15px 35px rgba(0, 0, 0, 0.8),
    0 0 0 1px rgba(45, 212, 191, 0.3),
    inset 0 0 30px rgba(45, 212, 191, 0.05);
  border: 1px solid rgba(45, 212, 191, 0.2);
  isolation: isolate;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.radio::-webkit-scrollbar { display: none; }

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  padding: 0 4px;
  gap: 8px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: clamp(0.95rem, 4vw, 1.1rem);
  font-weight: bold;
  background: linear-gradient(135deg, var(--accent-light), var(--accent));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
}

.brand i {
  color: var(--accent);
  -webkit-text-fill-color: var(--accent);
  font-size: 1.3rem;
  flex-shrink: 0;
}

.live {
  background: var(--danger);
  color: #fff;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.7rem;
  display: flex;
  align-items: center;
  gap: 5px;
  animation: pulse 2s infinite ease-in-out;
  flex-shrink: 0;
}

.live i { font-size: 0.5rem; animation: blink 1.5s infinite; }

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.cover {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 24px;
  overflow: hidden;
  margin-bottom: 16px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
  background: linear-gradient(145deg, var(--bg-dark), var(--accent-dark));
}

.cover img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: filter 0.4s ease, opacity 0.4s ease;
  filter: brightness(0.85) saturate(1.2);
  will-change: filter, opacity;
  z-index: 1;
}

.cover img.fade-out { opacity: 0; }

.waves {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 70px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 4px;
  padding-bottom: 8px;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
  pointer-events: none;
  z-index: 4;
}

.bar {
  width: 4px;
  background: var(--accent);
  border-radius: 3px;
  box-shadow: 0 0 8px var(--accent);
  transform-origin: bottom center;
  animation: wave 1.2s infinite ease-in-out;
}

.bar:nth-child(1) { height: 15px; animation-delay: 0s; }
.bar:nth-child(2) { height: 30px; animation-delay: 0.1s; }
.bar:nth-child(3) { height: 45px; animation-delay: 0.2s; }
.bar:nth-child(4) { height: 25px; animation-delay: 0.3s; }
.bar:nth-child(5) { height: 50px; animation-delay: 0.4s; }
.bar:nth-child(6) { height: 35px; animation-delay: 0.5s; }
.bar:nth-child(7) { height: 20px; animation-delay: 0.6s; }
.bar:nth-child(8) { height: 45px; animation-delay: 0.7s; }
.bar:nth-child(9) { height: 30px; animation-delay: 0.8s; }
.bar:nth-child(10) { height: 15px; animation-delay: 0.9s; }

@keyframes wave {
  0%, 100% { transform: scaleY(0.5); opacity: 0.5; }
  50% { transform: scaleY(1.6); opacity: 1; }
}

.paused .bar {
  animation-play-state: paused;
  transform: scaleY(0.5);
  opacity: 0.5;
}

.info {
  text-align: center;
  margin-bottom: 16px;
}

.title {
  color: #fff;
  font-size: clamp(1rem, 4.2vw, 1.1rem);
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 0 12px rgba(45, 212, 191, 0.5);
  margin-bottom: 4px;
  min-height: 22px;
}

.artist {
  color: #9ca3af;
  font-size: clamp(0.75rem, 3.2vw, 0.85rem);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-height: 18px;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 16px;
}

.btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #d1d5db;
  width: 50px;
  height: 50px;
  min-width: 44px;
  min-height: 44px;
  border-radius: 50%;
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.3s ease, opacity 0.3s ease;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}

.btn:active { transform: scale(0.9); }

.btn.play {
  width: 70px;
  height: 70px;
  font-size: 1.8rem;
  background: linear-gradient(145deg, var(--accent-dark), var(--accent));
  color: var(--bg-dark);
  border: none;
  box-shadow: 0 8px 20px rgba(45, 212, 191, 0.4);
  transition: transform 0.15s ease, box-shadow 0.3s ease, opacity 0.3s ease;
  flex-shrink: 0;
  padding: 0;
}

.btn:disabled, .genre.disabled {
  opacity: 0.5;
  cursor: not-allowed;
  pointer-events: none;
  transform: none !important;
}

.btn.play:active {
  transform: scale(0.93);
  box-shadow: 0 4px 12px rgba(45, 212, 191, 0.5);
}

.btn.play.loading i { animation: spin 1s linear infinite; }

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.volume-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  padding: 0 6px;
}

.volume-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--accent);
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  border-radius: 50%;
  font-size: 0.95rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.25s ease, color 0.25s ease;
  flex-shrink: 0;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}

.volume-btn:active { transform: scale(0.9); }

.volume-btn.mute {
  color: var(--danger);
  border-color: rgba(239, 68, 68, 0.4);
}

.volume-slider {
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  width: 100%;
  min-width: 0;
  height: 32px;
  background: transparent;
  outline: none;
  cursor: pointer;
  direction: ltr;
  margin: 0;
  padding: 0;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  background-image: linear-gradient(
    to right,
    var(--accent) 0%,
    var(--accent) var(--vol-percent, 100%),
    rgba(255, 255, 255, 0.12) var(--vol-percent, 100%),
    rgba(255, 255, 255, 0.12) 100%
  );
  background-size: 100% 6px;
  background-repeat: no-repeat;
  background-position: center;
  border-radius: 3px;
}

.volume-slider::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 3px;
  background: transparent;
}

.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: -7px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg-dark);
  box-shadow: 0 0 10px rgba(45, 212, 191, 0.7);
  cursor: grab;
  transition: transform 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}

.volume-slider::-webkit-slider-thumb:active {
  transform: scale(1.25);
  cursor: grabbing;
}

.volume-slider::-moz-range-track {
  height: 6px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.12);
}

.volume-slider::-moz-range-progress {
  height: 6px;
  border-radius: 3px;
  background: var(--accent);
}

.volume-slider::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg-dark);
  box-shadow: 0 0 10px rgba(45, 212, 191, 0.7);
  cursor: grab;
}

.volume-slider::-moz-range-thumb:active {
  cursor: grabbing;
}

.volume-value {
  color: var(--accent-light);
  font-size: 0.7rem;
  min-width: 38px;
  text-align: center;
  font-weight: bold;
  text-shadow: 0 0 8px rgba(45, 212, 191, 0.5);
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.genres {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}

.genre {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 10px;
  padding: 8px 4px;
  font-size: clamp(0.6rem, 2.6vw, 0.7rem);
  color: #9ca3af;
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.25s ease,
              border-color 0.25s ease, color 0.25s ease, opacity 0.3s ease;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  min-height: 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.genre i {
  display: block;
  font-size: 0.9rem;
  margin-bottom: 3px;
  color: var(--accent);
  transition: color 0.25s ease;
}

.genre.active {
  background: rgba(45, 212, 191, 0.15);
  border-color: var(--accent);
  color: var(--accent-light);
  box-shadow: 0 0 12px rgba(45, 212, 191, 0.3);
}

.genre:active { transform: scale(0.95); }

.status {
  text-align: center;
  font-size: 0.7rem;
  color: #6b7280;
  margin-top: 10px;
  min-height: 14px;
  transition: color 0.3s ease;
  line-height: 1.4;
}

.visualizer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
  display: block;
}

.cover::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 55%, rgba(45, 212, 191, 0.05), transparent 40%),
    linear-gradient(to top, rgba(0, 0, 0, 0.4), transparent 45%);
}

.btn:focus-visible,
.volume-btn:focus-visible,
.genre:focus-visible,
.volume-slider:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

@media (max-width: 360px) {
  .radio { border-radius: 24px; padding: 16px 12px; }
  .brand span { display: none; }
  .brand i { font-size: 1.5rem; }
  .volume-value { min-width: 34px; font-size: 0.65rem; }
  .genre { padding: 6px 2px; font-size: 0.6rem; }
}

@media (min-width: 768px) {
  .radio { max-width: 420px; padding: 24px 20px; }
  .genre { font-size: 0.72rem; }
}

@media (hover: hover) and (pointer: fine) {
  .genre:hover {
    background: rgba(255, 255, 255, 0.07);
    border-color: rgba(45, 212, 191, 0.4);
  }
  .btn:hover { background: rgba(255, 255, 255, 0.1); }
  .volume-btn:hover { background: rgba(45, 212, 191, 0.15); }
}
</style>
</head>
<body>

<div class="radio" id="radio">
  <div class="header">
    <div class="brand">
      <i class="fas fa-broadcast-tower"></i>
      <span>رادیو ارک ماین</span>
    </div>
    <div class="live">
      <i class="fas fa-circle"></i> زنده
    </div>
  </div>

  <div class="cover">
    <img id="cover" alt="cover" crossorigin="anonymous">
    <canvas id="visualizer" class="visualizer"></canvas>
    <div class="waves paused" id="waves" aria-hidden="true">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <div class="info">
    <div class="title" id="title">SMOKED OUT</div>
    <div class="artist" id="artist">PRXSXNT FXTURE • Phonk</div>
  </div>

  <div class="controls">
    <button class="btn play" id="play" aria-label="پخش/توقف">
      <i class="fas fa-play" id="playIcon"></i>
    </button>
  </div>

  <div class="volume-wrap">
    <button class="volume-btn" id="muteBtn" title="بی‌صدا / وصل صدا" aria-label="بی‌صدا">
      <i class="fas fa-volume-high" id="muteIcon"></i>
    </button>
    <input type="range" class="volume-slider" id="volumeSlider"
           min="0" max="100" step="1" value="100"
           aria-label="میزان صدا" inputmode="numeric">
    <span class="volume-value" id="volumeValue">100%</span>
  </div>

  <div class="genres" id="genres">
    <div class="genre active" data-stream="phonk" tabindex="0" role="button"><i class="fas fa-headphones"></i>فونک</div>
    <div class="genre" data-stream="phonk2" tabindex="0" role="button"><i class="fas fa-fire"></i>فونک۲</div>
    <div class="genre" data-stream="persian" tabindex="0" role="button"><i class="fas fa-heart"></i>فارسی</div>
    <div class="genre" data-stream="lofi" tabindex="0" role="button"><i class="fas fa-moon"></i>لوفای</div>
    <div class="genre" data-stream="soul" tabindex="0" role="button"><i class="fas fa-sun"></i>سول</div>
    <div class="genre" data-stream="rock" tabindex="0" role="button"><i class="fas fa-guitar"></i>راک</div>
    <div class="genre" data-stream="pop" tabindex="0" role="button"><i class="fas fa-star"></i>پاپ</div>
    <div class="genre" data-stream="hiphop" tabindex="0" role="button"><i class="fas fa-microphone"></i>هیپ‌هاپ</div>
    <div class="genre" data-stream="country" tabindex="0" role="button"><i class="fas fa-hat-cowboy"></i>کانتری</div>
    <div class="genre" data-stream="ost" tabindex="0" role="button"><i class="fas fa-film"></i>متن فیلم</div>
    <div class="genre" data-stream="pop2" tabindex="0" role="button"><i class="fas fa-music"></i>پاپ۲</div>
    <div class="genre" data-stream="persianrap" tabindex="0" role="button"><i class="fas fa-microphone-lines"></i>رپ فارسی</div>
    <div class="genre" data-stream="relaxing" tabindex="0" role="button"><i class="fas fa-spa"></i>ریلکسینگ</div>
  </div>

  <div class="status" id="status">برای پخش، دکمه ▶️ را بزن</div>
</div>

<audio id="audio" preload="none" crossorigin="anonymous"></audio>

<script>
(function () {
  "use strict";

  function setVH() {
    document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
  }
  setVH();
  window.addEventListener('resize', setVH);
  window.addEventListener('orientationchange', () => setTimeout(setVH, 200));

  const audio      = document.getElementById("audio");
  const playBtn    = document.getElementById("play");
  const playIcon   = document.getElementById("playIcon");
  const waves      = document.getElementById("waves");
  const cover      = document.getElementById("cover");
  const title      = document.getElementById("title");
  const artist     = document.getElementById("artist");
  const statusEl   = document.getElementById("status");
  const genresContainer = document.getElementById("genres");
  const genres     = document.querySelectorAll(".genre");
  const canvas     = document.getElementById("visualizer");
  const ctx        = canvas.getContext("2d", { alpha: true });

  const volumeSlider = document.getElementById("volumeSlider");
  const volumeValue  = document.getElementById("volumeValue");
  const muteBtn      = document.getElementById("muteBtn");
  const muteIcon     = document.getElementById("muteIcon");

  const FALLBACK_IMG = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#0b0e14"/>
          <stop offset="100%" stop-color="#0f766e"/>
        </linearGradient>
      </defs>
      <rect width="600" height="600" fill="url(#g)"/>
      <circle cx="300" cy="300" r="140" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-dasharray="18, 12" opacity="0.4"/>
      <circle cx="300" cy="300" r="70" fill="none" stroke="#2dd4bf" stroke-width="3" opacity="0.6"/>
      <circle cx="300" cy="300" r="15" fill="#2dd4bf" opacity="0.8"/>
    </svg>
  `);

  let playing = false;
  let loading = false;
  let coverTimer = null;
  let currentGenre = "phonk";
  let coverIndex = 0;
  let playRequestId = 0;
  let retryTimer = null;
  let saveVolTimer = null; 

  let currentVolume = parseFloat(localStorage.getItem("radioVol"));
  if (isNaN(currentVolume) || currentVolume < 0 || currentVolume > 1) currentVolume = 1;
  let lastVolume = currentVolume > 0 ? currentVolume : 1;

  const BASE_URL = (location.protocol === "https:" ? "https://" : "http://") + "radio.9craft.ir:7443/";

  let audioContext = null;
  let analyser = null;
  let sourceNode = null;
  let gainNode = null;
  let freqData = null;
  let timeData = null;
  let audioGraphReady = false;
  let rafId = null;

  const genresData = {
    phonk:  { title: "SMOKED OUT", artist: "PRXSXNT FXTURE • Phonk",
      covers: ["https://picsum.photos/seed/phonk1/600","https://picsum.photos/seed/phonk2/600"] },
    phonk2: { title: "MONTAGEM GREEN", artist: "Tsk.4 • Phonk2",
      covers: ["https://picsum.photos/seed/phonk2a/600","https://picsum.photos/seed/phonk2b/600"] },
    persian:{ title: "Zemestoon", artist: "Afshin Moghadam • Persian",
      covers: ["https://picsum.photos/seed/persian1/600","https://picsum.photos/seed/persian2/600"] },
    lofi:   { title: "Crépuscule", artist: "DLJ • Lofi",
      covers: ["https://picsum.photos/seed/lofi1/600","https://picsum.photos/seed/lofi2/600"] },
    soul:   { title: "Soul", artist: "Radio • Soul",
      covers: ["https://picsum.photos/seed/soul1/600","https://picsum.photos/seed/soul2/600"] },
    rock:   { title: "Rock", artist: "Radio • Rock",
      covers: ["https://picsum.photos/seed/rock1/600","https://picsum.photos/seed/rock2/600"] },
    pop:    { title: "Pop", artist: "Radio • Pop",
      covers: ["https://picsum.photos/seed/pop1/600","https://picsum.photos/seed/pop2/600"] },
    hiphop: { title: "Hip-Hop", artist: "Radio • Hip-Hop",
      covers: ["https://picsum.photos/seed/hiphop1/600","https://picsum.photos/seed/hiphop2/600"] },
    country:{ title: "Country", artist: "Radio • Country",
      covers: ["https://picsum.photos/seed/country1/600","https://picsum.photos/seed/country2/600"] },
    ost:     { title: "OST", artist: "Radio • OST", urlPath: "ost", covers: ["https://picsum.photos/seed/ost1/600"] },
    pop2:    { title: "Pop 2", artist: "Radio • Pop 2", urlPath: "pop2", covers: ["https://picsum.photos/seed/pop2a/600"] },
    persianrap: { title: "Persian Rap", artist: "Radio • Persian Rap", urlPath: "prap", covers: ["https://picsum.photos/seed/rap1/600"] },
    relaxing:{ title: "Relaxing", artist: "Radio • Relaxing", urlPath: "relax", covers: ["https://picsum.photos/seed/relax1/600"] }
  };

  function setupAudioGraph() {
    if (audioGraphReady) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) throw new Error("Web Audio API unavailable");
      audioContext = new AC();
      sourceNode = audioContext.createMediaElementSource(audio);
      gainNode = audioContext.createGain();
      gainNode.gain.value = currentVolume;
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.8;
      analyser.minDecibels = -90;
      analyser.maxDecibels = -10;
      sourceNode.connect(gainNode);
      gainNode.connect(analyser);
      analyser.connect(audioContext.destination);
      freqData = new Uint8Array(analyser.frequencyBinCount);
      timeData = new Uint8Array(analyser.fftSize);
      audioGraphReady = true;
      resizeCanvas();
      return true;
    } catch (err) {
      console.warn("Web Audio unavailable:", err);
      return false;
    }
  }

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  let lastFrame = 0;
  const FRAME_INTERVAL = 1000 / 30; 

  function drawVisualizer(now) {
    rafId = requestAnimationFrame(drawVisualizer);
    const t = now || performance.now();
    if (t - lastFrame < FRAME_INTERVAL) return;
    lastFrame = t;

    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (w === 0 || h === 0) return;

    ctx.clearRect(0, 0, w, h);

    if (!analyser || !freqData || !timeData) {
      const cx = w / 2, cy = h * 0.53;
      const t2 = performance.now() / 800;
      const r = Math.min(w, h) * 0.2 * (1 + Math.sin(t2) * 0.06);
      ctx.fillStyle = "rgba(45,212,191,0.1)";
      ctx.beginPath();
      ctx.arc(cx, cy, r * 2, 0, Math.PI * 2);
      ctx.fill();
      return;
    }

    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(timeData);

    let bassSum = 0, level = 0;
    const n = freqData.length;
    for (let i = 0; i < n; i++) {
      const v = freqData[i] / 255;
      level += v;
      if (i < n * 0.12) bassSum += v;
    }
    level = level / n;
    const bass = bassSum / Math.max(1, n * 0.12);

    const pulse = 1 + Math.min(.15, bass * .2 + level * .05);
    const cx = w / 2, cy = h * .53;
    const radius = Math.min(w, h) * .22 * pulse;

    ctx.shadowBlur = 15 + bass * 20;
    ctx.shadowColor = "rgba(45,212,191,0.6)";
    ctx.fillStyle = `rgba(45,212,191,0.15)`;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();

    const bars = 50; 
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.strokeStyle = `rgba(45,212,191,${0.5 + level * 0.4})`;
    ctx.shadowBlur = 0; 

    ctx.beginPath();
    for (let i = 0; i < bars; i++) {
      const idx = Math.floor(i * (freqData.length * .8) / bars);
      const value = freqData[idx] / 255;
      const angle = (Math.PI * 2 * i) / bars - Math.PI / 2;
      const inner = radius + 3;
      const outer = inner + 5 + value * Math.min(w, h) * .12;
      ctx.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner);
      ctx.lineTo(cx + Math.cos(angle) * outer, cy + Math.sin(angle) * outer);
    }
    ctx.stroke();

    // ✅ برگرداندن نوار خطی (موج صدا) به پایین ویژوالایزر
    ctx.beginPath();
    for (let x = 0; x <= w; x += 3) {
      const i = Math.floor((x / w) * timeData.length);
      const sample = (timeData[i] - 128) / 128;
      const y = h - 20 - sample * (15 + level * 30);
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = `rgba(165, 243, 252, ${0.3 + level * 0.6})`; // رنگ آبی روشن فسفری
    ctx.stroke();

    if (playing) {
      const brightness = 0.85 + Math.min(.25, level * .4 + bass * .1);
      cover.style.filter = `brightness(${brightness}) saturate(1.2)`;
    }
  }

  cover.onerror = function() {
    if (cover.src !== FALLBACK_IMG) cover.src = FALLBACK_IMG;
  };

  function changeCover(genre) {
    const data = genresData[genre];
    if (!data) return;
    coverIndex = (coverIndex + 1) % data.covers.length;
    const nextCover = data.covers[coverIndex];

    const newImg = new Image();
    newImg.crossOrigin = "anonymous";
    newImg.onload = function () {
      cover.classList.add("fade-out");
      setTimeout(() => {
        cover.src = newImg.src;
        requestAnimationFrame(() => cover.classList.remove("fade-out"));
      }, 300);
    };
    newImg.onerror = () => {
      if (cover.src !== FALLBACK_IMG) cover.src = FALLBACK_IMG;
    };
    newImg.src = nextCover;
  }

  function startCoverRotation() {
    stopCoverRotation();
    coverTimer = setInterval(() => changeCover(currentGenre), 12000);
  }
  function stopCoverRotation() {
    if (coverTimer) { clearInterval(coverTimer); coverTimer = null; }
  }

  function setLoadingUI(isLoading) {
    loading = isLoading;
    playBtn.disabled = isLoading;
    genres.forEach(g => {
      if (isLoading) g.classList.add("disabled");
      else g.classList.remove("disabled");
    });
    
    if (isLoading) {
      playIcon.className = "fas fa-spinner";
      playBtn.classList.add("loading");
    } else {
      playBtn.classList.remove("loading");
    }
  }

  async function togglePlay() {
    if (loading) return;
    if (playing) {
      clearTimeout(retryTimer);
      audio.pause();
      playing = false;
      playIcon.className = "fas fa-play";
      waves.classList.add("paused");
      statusEl.textContent = "متوقف شد";
      stopCoverRotation();
      return;
    }
    await startStream();
  }

  async function startStream(isAutoReconnect = false) {
    if (loading && !isAutoReconnect) return;

    const active = document.querySelector(".genre.active");
    const genre = active ? active.getAttribute("data-stream") : currentGenre;
    const data = genresData[genre];
    
    const path = (data && data.urlPath) ? data.urlPath : genre;
    const url = BASE_URL + path;
    
    const reqId = ++playRequestId;

    setLoadingUI(true);
    statusEl.textContent = isAutoReconnect ? "⏳ تلاش مجدد..." : "در حال اتصال...";

    try {
      setupAudioGraph();
      if (audioContext && audioContext.state === "suspended") {
        try { await audioContext.resume(); } catch(_) {}
      }
      if (audio.src !== url) {
        audio.src = url;
        audio.load();
      }
      audio.volume = currentVolume;
      await audio.play();

      if (reqId !== playRequestId) return;

      setLoadingUI(false);
      playing = true;
      currentGenre = genre;
      playIcon.className = "fas fa-pause";
      waves.classList.remove("paused");
      statusEl.textContent = "🎵 پخش زنده";
      coverIndex = 0;
      startCoverRotation();
    } catch (err) {
      if (reqId !== playRequestId) return;
      setLoadingUI(false);
      playing = false;
      playIcon.className = "fas fa-play";
      waves.classList.add("paused");
      stopCoverRotation();

      let msg = "⚠️ اتصال ناموفق؛ دوباره ▶️ را بزن";
      if (err && err.name === "NotAllowedError") msg = "⚠️ مرورگر اجازه پخش نداد؛ یک بار دیگر بزن";
      else if (err && err.name === "NotSupportedError") msg = "⚠️ این ژانر روی سرور موجود نیست";
      
      statusEl.textContent = msg;
      console.log("خطای پخش:", err);
    }
  }

  function handleConnectionLoss() {
    if (!playing) return;
    statusEl.textContent = "⏳ اینترنت قطع شد؛ تلاش مجدد...";
    setLoadingUI(true);
    if (retryTimer) clearTimeout(retryTimer);
    retryTimer = setTimeout(() => {
      if (playing) startStream(true);
    }, 3000);
  }

  window.addEventListener("online", () => { if (playing) startStream(true); });

  audio.addEventListener("playing", () => {
    clearTimeout(retryTimer);
    setLoadingUI(false);
    playing = true;
    playIcon.className = "fas fa-pause";
    waves.classList.remove("paused");
  });

  audio.addEventListener("waiting", () => {
    if (playing) {
      statusEl.textContent = "⏳ بافر کردن...";
      playIcon.className = "fas fa-spinner";
      playBtn.classList.add("loading");
    }
  });

  audio.addEventListener("canplay", () => {
    if (playing) {
      playBtn.classList.remove("loading");
      playIcon.className = "fas fa-pause";
    }
  });

  audio.addEventListener("error", handleConnectionLoss);
  audio.addEventListener("stalled", handleConnectionLoss);
  audio.addEventListener("pause", () => { if (!loading) stopCoverRotation(); });

  playBtn.addEventListener("click", togglePlay);

  function selectGenre(el) {
    if (loading) return;
    const genre = el.getAttribute("data-stream");
    if (genre === currentGenre && playing) return;

    currentGenre = genre;
    genres.forEach(g => g.classList.remove("active"));
    el.classList.add("active");

    const data = genresData[genre];
    if (data) {
      title.textContent = data.title;
      artist.textContent = data.artist;
    }

    coverIndex = 0;
    if (data && data.covers && data.covers[0]) cover.src = data.covers[0];

    if (playing) {
      stopCoverRotation();
      audio.pause();
      playing = false;
      setTimeout(() => { startStream(); }, 120);
    } else {
      statusEl.textContent = "برای پخش، دکمه ▶️ را بزن";
    }
  }

  genresContainer.addEventListener("click", (e) => {
    const el = e.target.closest(".genre");
    if (el && !el.classList.contains("disabled")) selectGenre(el);
  });

  genresContainer.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      const el = e.target.closest(".genre");
      if (el && !el.classList.contains("disabled")) { 
        e.preventDefault(); 
        selectGenre(el); 
      }
    }
  });

  function applyVolume(v) {
    v = Math.max(0, Math.min(1, v));
    currentVolume = v;

    clearTimeout(saveVolTimer);
    saveVolTimer = setTimeout(() => {
      localStorage.setItem("radioVol", v);
    }, 500);

    if (audioGraphReady && gainNode && audioContext) {
      const now = audioContext.currentTime;
      try {
        gainNode.gain.cancelScheduledValues(now);
        gainNode.gain.setTargetAtTime(v, now, 0.05);
      } catch(_) { gainNode.gain.value = v; }
      try { audio.volume = 1; } catch(_) {}
    } else {
      try { audio.volume = v; } catch(_) {}
    }
  }

  function updateVolumeUI(v) {
    const percent = Math.round(v * 100);
    volumeValue.textContent = percent + "%";
    volumeSlider.value = percent;
    volumeSlider.style.setProperty("--vol-percent", percent + "%");
    muteIcon.className = "fas " +
      (v === 0 ? "fa-volume-xmark" : v < 0.33 ? "fa-volume-off" : v < 0.66 ? "fa-volume-low" : "fa-volume-high");
    muteBtn.classList.toggle("mute", v === 0);
  }

  function setVolume(v, { updateLast = true } = {}) {
    v = Math.max(0, Math.min(1, v));
    if (v > 0 && updateLast) lastVolume = v;
    applyVolume(v);
    updateVolumeUI(v);
  }

  volumeSlider.addEventListener("input", (e) => {
    setVolume(parseFloat(e.target.value) / 100);
  }, { passive: true });

  volumeSlider.addEventListener("change", (e) => {
    setVolume(parseFloat(e.target.value) / 100);
  }, { passive: true });

  let isDragging = false;
  volumeSlider.addEventListener("pointerdown", (e) => {
    isDragging = true;
    if (audioContext && audioContext.state === "suspended") audioContext.resume().catch(() => {});
    try { volumeSlider.setPointerCapture(e.pointerId); } catch(_) {}
  });
  volumeSlider.addEventListener("pointerup", () => { isDragging = false; });
  volumeSlider.addEventListener("pointercancel", () => { isDragging = false; });
  volumeSlider.addEventListener("lostpointercapture", () => { isDragging = false; });
  volumeSlider.addEventListener("pointermove", (e) => {
    if (!isDragging) return;
    const rect = volumeSlider.getBoundingClientRect();
    const x = e.clientX - rect.left;
    setVolume(Math.max(0, Math.min(1, x / rect.width)));
  });

  muteBtn.addEventListener("click", () => {
    if (currentVolume > 0) { lastVolume = currentVolume; setVolume(0, { updateLast: false }); }
    else { setVolume(lastVolume || 1); }
  });

  volumeSlider.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp" || e.key === "ArrowRight") { e.preventDefault(); setVolume(currentVolume + 0.05); }
    else if (e.key === "ArrowDown" || e.key === "ArrowLeft") { e.preventDefault(); setVolume(currentVolume - 0.05); }
    else if (e.key === "Home") { e.preventDefault(); setVolume(0); }
    else if (e.key === "End") { e.preventDefault(); setVolume(1); }
  });

  setVolume(currentVolume);

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeCanvas, 150);
  });
  window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 300));

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      stopCoverRotation();
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    } else {
      if (playing) {
        startCoverRotation();
        if (audioContext && audioContext.state === "suspended") audioContext.resume().catch(() => {});
        if (audio.paused) audio.play().catch(() => {});
      }
      lastFrame = 0;
      if (!rafId) rafId = requestAnimationFrame(drawVisualizer);
    }
  });

  cover.src = FALLBACK_IMG;
  if (genresData[currentGenre] && genresData[currentGenre].covers[0]) {
    const firstCover = new Image();
    firstCover.crossOrigin = "anonymous";
    firstCover.onload = () => { cover.src = firstCover.src; };
    firstCover.src = genresData[currentGenre].covers[0];
  }

  resizeCanvas();
  rafId = requestAnimationFrame(drawVisualizer);
  statusEl.textContent = "برای پخش، دکمه ▶️ را بزن";
})();
</script>
