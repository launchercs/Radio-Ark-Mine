<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>رادیو ناین کرافت</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
/* ---------- Reset & Base ---------- */
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

:root {
  --font-fa: "Segoe UI", Tahoma, "Iranian Sans", "Vazirmatn",
             system-ui, -apple-system, "Noto Sans Arabic", "DejaVu Sans",
             Arial, sans-serif;
  --accent: #2dd4bf;
  --accent-light: #a5f3fc;
  --accent-dark: #0f766e;
  --bg-dark: #0b0e14;
  --bg-mid: #1a1f2c;
  --panel: rgba(20, 25, 35, 0.9);
  --danger: #ef4444;
}

html {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  width: 100%;
  height: 100vh;
  height: calc(var(--vh, 1vh) * 100);
  height: 100dvh;
  overflow: hidden;
  font-family: var(--font-fa);
  background: linear-gradient(145deg, var(--bg-dark), var(--bg-mid));
  background-attachment: fixed;
  display: flex;
  justify-content: center;
  align-items: center;
  padding:
    calc(10px + env(safe-area-inset-top, 0px))
    calc(10px + env(safe-area-inset-right, 0px))
    calc(10px + env(safe-area-inset-bottom, 0px))
    calc(10px + env(safe-area-inset-left, 0px));
  color: #fff;
  -webkit-user-select: none;
  user-select: none;
  transform: translateZ(0);
  backface-visibility: hidden;
  overscroll-behavior: none;
  position: fixed;
  inset: 0;
  line-height: 1.4;
}

.radio {
  width: 100%;
  max-width: 400px;
  max-height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  background: var(--panel);
  border-radius: 32px;
  padding: 20px 16px;
  box-shadow:
    0 20px 40px rgba(0, 0, 0, 0.8),
    0 0 0 1px rgba(45, 212, 191, 0.2),
    inset 0 0 30px rgba(45, 212, 191, 0.08);
  border: 1px solid rgba(45, 212, 191, 0.2);
  animation: glow 5s infinite alternate;
  will-change: box-shadow;
  isolation: isolate;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.radio::-webkit-scrollbar {
  display: none;
}

@keyframes glow {
  0% {
    box-shadow:
      0 20px 40px rgba(0, 0, 0, 0.8),
      0 0 0 1px rgba(45, 212, 191, 0.2);
  }
  100% {
    box-shadow:
      0 20px 50px rgba(45, 212, 191, 0.3),
      0 0 0 1px rgba(45, 212, 191, 0.5);
  }
}

/* ---------- هدر ---------- */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  padding: 0 4px;
  gap: 8px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: clamp(0.95rem, 4vw, 1.1rem);
  font-weight: bold;
  background: linear-gradient(135deg, var(--accent-light), var(--accent));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
}

.brand i {
  color: var(--accent);
  -webkit-text-fill-color: var(--accent);
  font-size: 1.3rem;
  flex-shrink: 0;
}

.live {
  background: var(--danger);
  color: #fff;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.7rem;
  display: flex;
  align-items: center;
  gap: 5px;
  animation: pulse 1.5s infinite;
  will-change: transform;
  flex-shrink: 0;
}

.live i { font-size: 0.5rem; animation: blink 1s infinite; }

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* ---------- کاور ---------- */
.cover {
  position: relative;
  width: 100%;
  padding-bottom: 100%;
  height: 0;
  border-radius: 24px;
  overflow: hidden;
  margin-bottom: 16px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
  background: var(--bg-dark);
}

.cover img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: filter 0.6s ease, opacity 0.6s ease;
  filter: brightness(0.85) saturate(1.2);
  will-change: filter, opacity;
  z-index: 1;
}

.cover img.fade-out { opacity: 0; }
.cover img.fade-in { opacity: 1; }

/* ---------- موج صوتی ---------- */
.waves {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 70px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 4px;
  padding-bottom: 8px;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
  pointer-events: none;
  z-index: 4;
}

.bar {
  width: 4px;
  background: var(--accent);
  border-radius: 3px;
  box-shadow: 0 0 8px var(--accent);
  transform-origin: bottom center;
  animation: wave 1.1s infinite ease-in-out;
  will-change: transform;
}

.bar:nth-child(1) { height: 15px; animation-delay: 0s; }
.bar:nth-child(2) { height: 30px; animation-delay: 0.09s; }
.bar:nth-child(3) { height: 45px; animation-delay: 0.18s; }
.bar:nth-child(4) { height: 25px; animation-delay: 0.27s; }
.bar:nth-child(5) { height: 50px; animation-delay: 0.36s; }
.bar:nth-child(6) { height: 35px; animation-delay: 0.45s; }
.bar:nth-child(7) { height: 20px; animation-delay: 0.54s; }
.bar:nth-child(8) { height: 45px; animation-delay: 0.63s; }
.bar:nth-child(9) { height: 30px; animation-delay: 0.72s; }
.bar:nth-child(10) { height: 15px; animation-delay: 0.81s; }

@keyframes wave {
  0%, 100% { transform: scaleY(0.5); opacity: 0.5; }
  50% { transform: scaleY(1.7); opacity: 1; }
}

.paused .bar {
  animation-play-state: paused;
  transform: scaleY(0.5);
  opacity: 0.5;
}

/* ---------- اطلاعات آهنگ ---------- */
.info {
  text-align: center;
  margin-bottom: 16px;
}

.title {
  color: #fff;
  font-size: clamp(1rem, 4.2vw, 1.1rem);
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 0 15px rgba(45, 212, 191, 0.5);
  margin-bottom: 4px;
  min-height: 22px;
}

.artist {
  color: #9ca3af;
  font-size: clamp(0.75rem, 3.2vw, 0.85rem);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-height: 18px;
}

/* ---------- کنترل‌ها ---------- */
.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 16px;
}

.btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #d1d5db;
  width: 50px;
  height: 50px;
  min-width: 44px;
  min-height: 44px;
  border-radius: 50%;
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.3s ease;
  will-change: transform;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}

.btn:active { transform: scale(0.9); }

.btn.play {
  width: 70px;
  height: 70px;
  font-size: 1.8rem;
  background: linear-gradient(145deg, var(--accent-dark), var(--accent));
  color: var(--bg-dark);
  border: none;
  box-shadow: 0 8px 20px rgba(45, 212, 191, 0.5);
  transition: transform 0.15s ease, box-shadow 0.3s ease;
  flex-shrink: 0;
  padding: 0;
}

.btn.play:active {
  transform: scale(0.93);
  box-shadow: 0 4px 12px rgba(45, 212, 191, 0.6);
}

.btn.play.loading {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* ---------- کنترل صدا ---------- */
.volume-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  padding: 0 6px;
}

.volume-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--accent);
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  border-radius: 50%;
  font-size: 0.95rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.25s ease, color 0.25s ease;
  flex-shrink: 0;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}

.volume-btn:active { transform: scale(0.9); }

.volume-btn.mute {
  color: var(--danger);
  border-color: rgba(239, 68, 68, 0.4);
}

/* اسلایدر سازگار با همه مرورگرها */
.volume-slider {
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  flex: 1;
  width: 100%;
  min-width: 0;
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(
    to left,
    var(--accent) 0%,
    var(--accent) var(--vol-percent, 100%),
    rgba(255, 255, 255, 0.1) var(--vol-percent, 100%),
    rgba(255, 255, 255, 0.1) 100%
  );
  outline: none;
  cursor: pointer;
  direction: ltr;
  -webkit-user-select: none;
  user-select: none;
  touch-action: pan-y;
  margin: 0;
  padding: 0;
}

.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg-dark);
  box-shadow: 0 0 10px rgba(45, 212, 191, 0.7);
  cursor: pointer;
  transition: transform 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}

.volume-slider::-webkit-slider-thumb:active {
  transform: scale(1.2);
}

.volume-slider::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg-dark);
  box-shadow: 0 0 10px rgba(45, 212, 191, 0.7);
  cursor: pointer;
}

.volume-slider::-moz-range-track {
  height: 6px;
  border-radius: 3px;
  background: transparent;
}

.volume-slider::-moz-range-progress {
  height: 6px;
  border-radius: 3px;
  background: var(--accent);
}

.volume-value {
  color: var(--accent-light);
  font-size: 0.7rem;
  min-width: 38px;
  text-align: center;
  font-weight: bold;
  text-shadow: 0 0 8px rgba(45, 212, 191, 0.5);
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

/* ---------- ژانرها ---------- */
.genres {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}

.genre {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 10px;
  padding: 8px 4px;
  font-size: clamp(0.6rem, 2.6vw, 0.7rem);
  color: #9ca3af;
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.25s ease,
              border-color 0.25s ease, color 0.25s ease;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  will-change: transform;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  min-height: 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.genre i {
  display: block;
  font-size: 0.9rem;
  margin-bottom: 3px;
  color: var(--accent);
  transition: color 0.25s ease;
}

.genre.active {
  background: rgba(45, 212, 191, 0.15);
  border-color: var(--accent);
  color: var(--accent-light);
  box-shadow: 0 0 12px rgba(45, 212, 191, 0.3);
}

.genre:active { transform: scale(0.95); }

/* ---------- وضعیت ---------- */
.status {
  text-align: center;
  font-size: 0.7rem;
  color: #6b7280;
  margin-top: 10px;
  min-height: 14px;
  transition: color 0.3s ease;
  line-height: 1.4;
}

/* ---------- Visualizer ---------- */
.visualizer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
  mix-blend-mode: screen;
  display: block;
}

.cover::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 55%, rgba(45, 212, 191, 0.08), transparent 38%),
    linear-gradient(to top, rgba(0, 0, 0, 0.42), transparent 45%);
}

/* ---------- Focus ---------- */
.btn:focus-visible,
.volume-btn:focus-visible,
.genre:focus-visible,
.volume-slider:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .radio { animation: none; }
  .live { animation: none; }
}

/* ---------- Landscape موبایل ---------- */
@media (max-height: 700px) and (orientation: landscape) {
  .cover {
    max-width: 200px;
    margin-left: auto;
    margin-right: auto;
  }
  .header { margin-bottom: 10px; }
  .info { margin-bottom: 10px; }
  .controls { margin-bottom: 10px; }
  .volume-wrap { margin-bottom: 10px; }
}

/* ---------- موبایل باریک ---------- */
@media (max-width: 360px) {
  .radio {
    border-radius: 24px;
    padding: 16px 12px;
  }
  .brand span { display: none; }
  .brand i { font-size: 1.5rem; }
  .volume-value {
    min-width: 34px;
    font-size: 0.65rem;
  }
  .genre {
    padding: 6px 2px;
    font-size: 0.6rem;
  }
}

/* ---------- تبلت/دسکتاپ ---------- */
@media (min-width: 768px) {
  .radio {
    max-width: 420px;
    padding: 24px 20px;
  }
  .genre { font-size: 0.72rem; }
}

/* ---------- Hover فقط با موس ---------- */
@media (hover: hover) and (pointer: fine) {
  .genre:hover {
    background: rgba(255, 255, 255, 0.07);
    border-color: rgba(45, 212, 191, 0.4);
  }
  .btn:hover {
    background: rgba(255, 255, 255, 0.1);
  }
  .volume-btn:hover {
    background: rgba(45, 212, 191, 0.15);
  }
}
</style>
</head>
<body>

<div class="radio" id="radio">
  <div class="header">
    <div class="brand">
      <i class="fas fa-broadcast-tower"></i>
      <span>ناین کرافت</span>
    </div>
    <div class="live">
      <i class="fas fa-circle"></i> زنده
    </div>
  </div>

  <div class="cover">
    <img id="cover" src="https://picsum.photos/seed/phonk1/600" alt="cover">
    <canvas id="visualizer" class="visualizer"></canvas>
    <div class="waves paused" id="waves" aria-hidden="true">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <div class="info">
    <div class="title" id="title">SMOKED OUT</div>
    <div class="artist" id="artist">PRXSXNT FXTURE • Phonk</div>
  </div>

  <div class="controls">
    <button class="btn play" id="play" aria-label="پخش/توقف">
      <i class="fas fa-play" id="playIcon"></i>
    </button>
  </div>

  <!-- کنترل صدا -->
  <div class="volume-wrap">
    <button class="volume-btn" id="muteBtn" title="بی‌صدا / وصل صدا" aria-label="بی‌صدا">
      <i class="fas fa-volume-high" id="muteIcon"></i>
    </button>
    <input type="range" class="volume-slider" id="volumeSlider"
           min="0" max="1" step="0.01" value="1"
           aria-label="میزان صدا" inputmode="numeric">
    <span class="volume-value" id="volumeValue">100%</span>
  </div>

  <div class="genres" id="genres">
    <div class="genre active" data-stream="phonk" tabindex="0" role="button"><i class="fas fa-headphones"></i>فونک</div>
    <div class="genre" data-stream="phonk2" tabindex="0" role="button"><i class="fas fa-fire"></i>فونک۲</div>
    <div class="genre" data-stream="persian" tabindex="0" role="button"><i class="fas fa-heart"></i>فارسی</div>
    <div class="genre" data-stream="lofi" tabindex="0" role="button"><i class="fas fa-moon"></i>لوفای</div>
    <div class="genre" data-stream="soul" tabindex="0" role="button"><i class="fas fa-sun"></i>سول</div>
    <div class="genre" data-stream="rock" tabindex="0" role="button"><i class="fas fa-guitar"></i>راک</div>
    <div class="genre" data-stream="pop" tabindex="0" role="button"><i class="fas fa-star"></i>پاپ</div>
    <div class="genre" data-stream="hiphop" tabindex="0" role="button"><i class="fas fa-microphone"></i>هیپ‌هاپ</div>
    <div class="genre" data-stream="country" tabindex="0" role="button"><i class="fas fa-hat-cowboy"></i>کانتری</div>
  </div>

  <div class="status" id="status">برای پخش، دکمه ▶️ را بزن</div>
</div>

<audio id="audio" preload="none" crossorigin="anonymous"></audio>

<script>

  /* ---------- Fallback برای dvh روی مرورگرهای قدیمی ---------- */
  function setVH() {
    const vh = window.innerHeight * 0.01;

  const volumeSlider = document.getElementById("volumeSlider");

  const muteIcon = document.getElementById("muteIcon");
  let lastVolume = 1;

  let playing = false;
  let loading = false;
  let coverTimer = null;
  let currentGenre = "phonk";
  let coverIndex = 0;

  const BASE_URL = "http://radio.9craft.ir:7443/";

  /* Web Audio */
  let audioContext = null;
  let analyser = null;
  let sourceNode = null;
  let freqData = null;
  let timeData = null;
  let audioGraphReady = false;
  let rafId = null;

  const genresData = {
    phonk: {
      title: "SMOKED OUT", artist: "PRXSXNT FXTURE • Phonk",
      covers: [
        "https://picsum.photos/seed/phonk1/600",
        "https://picsum.photos/seed/phonk2/600",
        "https://picsum.photos/seed/phonk3/600",
        "https://picsum.photos/seed/neon-phonk/600"
      ]
    },
    phonk2: {
      title: "MONTAGEM GREEN", artist: "Tsk.4 • Phonk2",
      covers: [
        "https://picsum.photos/seed/phonk2a/600",
        "https://picsum.photos/seed/phonk2b/600",
        "https://picsum.photos/seed/dark-phonk/600"
      ]
    },
    persian: {
      title: "Zemestoon", artist: "Afshin Moghadam • Persian",
      covers: [

      ]
    },
    lofi: {

        "https://picsum.photos/seed/lofi2/600",
        "https://picsum.photos/seed/chill/600"
      ]
    },
    soul: {
      title: "Soul", artist: "Radio • Soul",
      covers: [
        "https://picsum.photos/seed/soul1/600",
        "https://picsum.photos/seed/soul2/600",
        "https://picsum.photos/seed/warm/600"
      ]
    },
    rock: {
      title: "Rock", artist: "Radio • Rock",
      covers: [
        "https://picsum.photos/seed/rock1/600",
        "https://picsum.photos/seed/rock2/600",
        "https://picsum.photos/seed/guitar/600"
      ]
    },
    pop: {
      title: "Pop", artist: "Radio • Pop",
      covers: [
        "https://picsum.photos/seed/pop1/600",
        "https://picsum.photos/seed/pop2/600",
        "https://picsum.photos/seed/colorful/600"
      ]
    },
    hiphop: {
      title: "Hip-Hop", artist: "Radio • Hip-Hop",
      covers: [
        "https://picsum.photos/seed/hiphop1/600",
        "https://picsum.photos/seed/hiphop2/600",
        "https://picsum.photos/seed/urban/600"
      ]
    },
    country: {
      title: "Country", artist: "Radio • Country",
      covers: [
        "https://picsum.photos/seed/country1/600",
        "https://picsum.photos/seed/country2/600",
        "https://picsum.photos/seed/nature/600"
      ]
    }
  };

  function setupAudioGraph() {
    if (audioGraphReady) return true;

    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) throw new Error("Web Audio API unavailable");

      audioContext = new AC();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.78;
      analyser.minDecibels = -90;
      analyser.maxDecibels = -10;

      sourceNode = audioContext.createMediaElementSource(audio);
      sourceNode.connect(analyser);
      analyser.connect(audioContext.destination);

      freqData = new Uint8Array(analyser.frequencyBinCount);
      timeData = new Uint8Array(analyser.fftSize);
      audioGraphReady = true;
      resizeCanvas();
      return true;
    } catch (err) {
      console.warn("Visualizer unavailable:", err);
      statusEl.textContent = "🎵 در حال پخش";
      return false;
    }
  }

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  let lastFrame = 0;
  const FRAME_INTERVAL = 1000 / 45;

  function drawVisualizer(now) {
    rafId = requestAnimationFrame(drawVisualizer);

    if (now && now - lastFrame < FRAME_INTERVAL) return;
    lastFrame = now || 0;

    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (w === 0 || h === 0) return;

    ctx.clearRect(0, 0, w, h);

    let bass = 0, mid = 0, level = 0;

    if (analyser && freqData && timeData) {
      analyser.getByteFrequencyData(freqData);
      analyser.getByteTimeDomainData(timeData);

      let bassSum = 0, midSum = 0, allSum = 0;
      const n = freqData.length;

      for (let i = 0; i < n; i++) {
        const v = freqData[i] / 255;
        allSum += v;
        if (i < n * 0.12) bassSum += v;
        else if (i < n * 0.5) midSum += v;
      }

      bass = bassSum / Math.max(1, n * 0.12);
      mid = midSum / Math.max(1, n * 0.38);
      level = allSum / n;
    }

    const pulse = 1 + Math.min(.18, bass * .22 + level * .08);
    const cx = w / 2, cy = h * .53;
    const radius = Math.min(w, h) * .22 * pulse;

    const glow = ctx.createRadialGradient(cx, cy, 2, cx, cy, radius * 2.3);
    glow.addColorStop(0, `rgba(45,212,191,${0.16 + bass * .22})`);
    glow.addColorStop(.45, `rgba(45,212,191,${0.06 + mid * .10})`);
    glow.addColorStop(1, "rgba(45,212,191,0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, radius * 2.3, 0, Math.PI * 2);
    ctx.fill();

    const bars = 72;
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.strokeStyle = `rgba(45,212,191,${0.42 + Math.min(.45, level)})`;

    ctx.beginPath();
    for (let i = 0; i < bars; i++) {
      const idx = Math.floor(i * (freqData ? freqData.length * .82 : 1) / bars);
      const value = freqData ? freqData[idx] / 255 : 0;
      const angle = (Math.PI * 2 * i) / bars - Math.PI / 2;
      const inner = radius + 4;
      const outer = inner + 10 + value * Math.min(w, h) * .15;
      const x1 = cx + Math.cos(angle) * inner;
      const y1 = cy + Math.sin(angle) * inner;
      const x2 = cx + Math.cos(angle) * outer;
      const y2 = cy + Math.sin(angle) * outer;
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
    }
    ctx.stroke();

    if (timeData) {
      ctx.beginPath();
      for (let x = 0; x <= w; x += 3) {
        const i = Math.floor((x / w) * timeData.length);
        const sample = (timeData[i] - 128) / 128;
        const y = h - 28 - sample * (12 + level * 25);
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = `rgba(165,243,252,${.25 + level * .5})`;
      ctx.stroke();
    }

    if (playing) {
      const brightness = 0.88 + Math.min(.28, level * .35 + bass * .08);
      const saturation = 1.18 + Math.min(.45, level * .55);
      cover.style.filter = `brightness(${brightness}) saturate(${saturation})`;
    }
  }

  function changeCover(genre) {
    const data = genresData[genre];
    if (!data) return;

    coverIndex = (coverIndex + 1) % data.covers.length;
    const nextCover = data.covers[coverIndex];
    cover.classList.add("fade-out");

    const newImg = new Image();
    newImg.onload = function () {
      cover.src = newImg.src;
      requestAnimationFrame(() => requestAnimationFrame(() => cover.classList.remove("fade-out")));
    };
    newImg.onerror = () => cover.classList.remove("fade-out");
    newImg.src = nextCover;
  }

  function startCoverRotation() {
    stopCoverRotation();
    coverTimer = setInterval(() => changeCover(currentGenre), 12000);
  }

  function stopCoverRotation() {
    if (coverTimer) {
      clearInterval(coverTimer);
      coverTimer = null;
    }
  }

  async function togglePlay() {
    if (loading) return;

    if (playing) {
      audio.pause();
      playing = false;
      playIcon.className = "fas fa-play";
      waves.classList.add("paused");
      statusEl.textContent = "متوقف شد";
      stopCoverRotation();
      return;
    }

    startStream();
  }

  async function startStream() {
    const active = document.querySelector(".genre.active");
    const genre = active ? active.getAttribute("data-stream") : currentGenre;
    const url = BASE_URL + genre;

    loading = true;
    playIcon.className = "fas fa-spinner";
    playBtn.classList.add("loading");
    statusEl.textContent = "در حال اتصال...";

    try {
      setupAudioGraph();
      if (audioContext && audioContext.state === "suspended") {
        await audioContext.resume();
      }

      if (audio.src !== url) {
        audio.src = url;
        audio.load();
      }

      await audio.play();

      loading = false;
      playing = true;
      currentGenre = genre;
      playBtn.classList.remove("loading");
      playIcon.className = "fas fa-pause";
      waves.classList.remove("paused");
      statusEl.textContent = "🎵 پخش زنده • واکنش به صدا فعال";
      coverIndex = 0;
      startCoverRotation();
    } catch (err) {
      loading = false;
      playing = false;
      playBtn.classList.remove("loading");
      playIcon.className = "fas fa-play";
      waves.classList.add("paused");
      statusEl.textContent = "⚠️ اتصال ناموفق؛ دوباره ▶️ را بزن";
      console.log("خطای پخش:", err);
    }
  }

  audio.addEventListener("playing", () => {
    loading = false;
    playing = true;
    playBtn.classList.remove("loading");
    playIcon.className = "fas fa-pause";
    waves.classList.remove("paused");
    statusEl.textContent = "🎵 در حال پخش زنده • Visualizer فعال";
  });

  audio.addEventListener("waiting", () => {
    if (playing) {
      statusEl.textContent = "⏳ بافر کردن...";
      playIcon.className = "fas fa-spinner";
      playBtn.classList.add("loading");
    }
  });

  audio.addEventListener("canplay", () => {
    if (playing) {
      playBtn.classList.remove("loading");
      playIcon.className = "fas fa-pause";
    }
  });

  audio.addEventListener("error", () => {
    loading = false;
    playing = false;
    playBtn.classList.remove("loading");
    playIcon.className = "fas fa-play";
    waves.classList.add("paused");
    stopCoverRotation();
    statusEl.textContent = "⚠️ خطا در اتصال به استریم";
  });

  audio.addEventListener("pause", stopCoverRotation);

  playBtn.addEventListener("click", togglePlay);

  function selectGenre(el) {
    const genre = el.getAttribute("data-stream");
    currentGenre = genre;

    genres.forEach(g => g.classList.remove("active"));
    el.classList.add("active");

    const data = genresData[genre];
    if (data) {
      title.textContent = data.title;
      artist.textContent = data.artist;
    }

    coverIndex = 0;
    if (data && data.covers && data.covers[0]) {
      cover.src = data.covers[0];
    }

    if (playing) {
      audio.pause();
      playing = false;
      stopCoverRotation();
      setTimeout(startStream, 180);
    } else {
      statusEl.textContent = "برای پخش، دکمه ▶️ را بزن";
    }
  }

  genresContainer.addEventListener("click", (e) => {
    const el = e.target.closest(".genre");
    if (el) selectGenre(el);
  });

  genresContainer.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      const el = e.target.closest(".genre");
      if (el) {
        e.preventDefault();
        selectGenre(el);
      }
    }
  });

  /* ---------- کنترل صدا ---------- */
  function updateVolumeUI(value) {
    const percent = Math.round(value * 100);
    volumeValue.textContent = percent + "%";
    volumeSlider.style.setProperty("--vol-percent", percent + "%");

    muteIcon.className = "fas " +
      (value === 0 ? "fa-volume-xmark" :
       value < 0.33 ? "fa-volume-off" :
       value < 0.66 ? "fa-volume-low" : "fa-volume-high");

    muteBtn.classList.toggle("mute", value === 0);
  }

  volumeSlider.addEventListener("input", () => {
    const val = parseFloat(volumeSlider.value);
    audio.volume = val;
    if (val > 0) lastVolume = val;
    updateVolumeUI(val);
  });

  volumeSlider.addEventListener("change", () => {
    const val = parseFloat(volumeSlider.value);
    audio.volume = val;
    if (val > 0) lastVolume = val;
    updateVolumeUI(val);
  });

  muteBtn.addEventListener("click", () => {
    if (audio.volume > 0) {
      lastVolume = audio.volume;
      audio.volume = 0;
      volumeSlider.value = 0;
      updateVolumeUI(0);
    } else {
      audio.volume = lastVolume || 1;
      volumeSlider.value = audio.volume;
      updateVolumeUI(audio.volume);
    }
  });

  volumeSlider.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp" || e.key === "ArrowRight") {
      e.preventDefault();
      const v = Math.min(1, audio.volume + 0.05);
      audio.volume = v; volumeSlider.value = v; updateVolumeUI(v);
    } else if (e.key === "ArrowDown" || e.key === "ArrowLeft") {
      e.preventDefault();
      const v = Math.max(0, audio.volume - 0.05);
      audio.volume = v; volumeSlider.value = v; updateVolumeUI(v);
    }
  });

  audio.volume = 1;
  updateVolumeUI(1);

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeCanvas, 150);
  });

  window.addEventListener("orientationchange", () => {
    setTimeout(resizeCanvas, 300);
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      stopCoverRotation();
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    } else {
      if (playing) startCoverRotation();
      if (!rafId) rafId = requestAnimationFrame(drawVisualizer);
    }
  });

  if (setupAudioGraph()) {
    rafId = requestAnimationFrame(drawVisualizer);
  }
  statusEl.textContent = "برای پخش، دکمه ▶️ را بزن";
})();
</script>
</body>
